<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minha Carteira</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Material+Symbols+Outlined" rel="stylesheet" />
<style>
  :root {
    --bg: #111418;
    --surface: #1c2229;
    --border: #283039;
    --fg: #f1f5f9;
    --muted: #94a3b8;
    --faint: #64748b;
    --primary: #137fec;
    --up: #4ade80;
    --down: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0b0d10;
    color: var(--fg);
    font-family: Manrope, sans-serif;
  }
  .phone {
    width: min(100%, 390px);
    min-height: 100vh;
    margin: 0 auto;
    background: var(--bg);
    position: relative;
    padding-bottom: 96px;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: rgba(28,34,41,.85); position: sticky; top: 0; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
  .brand .sq {
    width: 32px; height: 32px; border-radius: 8px;
    background: rgba(19,127,236,.2); color: var(--primary);
    display: grid; place-items: center;
  }
  .tools { display: flex; align-items: center; gap: 8px; }
  .spark {
    height: 36px; padding: 0 10px; border-radius: 8px;
    border: 1px solid rgba(19,127,236,.5); background: rgba(19,127,236,.1);
    color: var(--primary); display: grid; place-items: center;
  }
  .round {
    width: 36px; height: 36px; border-radius: 999px;
    background: var(--border); color: var(--fg); display: grid; place-items: center;
  }
  .avatar { width: 36px; height: 36px; border-radius: 999px; border: 2px solid var(--border); background: #334155; }
  .page { padding: 20px 16px 0; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.03em; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; font-weight: 600; }
  .tools-row { display: flex; flex-direction: column; gap: 10px; }
  .date, .total {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    height: 54px; padding: 0 14px;
  }
  .date { justify-content: space-between; font-weight: 700; font-size: 14px; }
  .date span, .total .ic { color: var(--muted); }
  .total .ic {
    width: 36px; height: 36px; border-radius: 8px; background: rgba(19,127,236,.1);
    color: var(--primary); display: grid; place-items: center;
  }
  .total small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; }
  .total b { font-size: 16px; }
  .switch {
    display: flex; padding: 3px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  }
  .switch button {
    flex: 1; border: 0; background: transparent; color: var(--muted);
    font: inherit; font-weight: 700; font-size: 13px; padding: 9px 8px; border-radius: 9px; cursor: pointer;
  }
  .switch button.on { background: var(--primary); color: white; }
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .sec-head { padding: 14px 14px 12px; border-bottom: 1px solid var(--border); background: rgba(17,20,24,.5); }
  .sec-title { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; }
  .sec-title .material-symbols-outlined { color: var(--primary); font-size: 20px; }
  .sec-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 8px; font-size: 12.5px; }
  .money { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sec-meta b { font-size: 14px; }
  .pipe { color: #475569; }
  .up { color: var(--up); font-weight: 700; }
  .down { color: var(--down); font-weight: 700; }
  .vs { color: #cbd5e1; font-size: 12px; font-weight: 600; }
  .pill { padding: 2px 8px; border-radius: 999px; background: var(--border); color: #cbd5e1; font-size: 11px; font-weight: 700; }
  .trend { display: inline-flex; align-items: center; gap: 2px; }
  .trend .material-symbols-outlined { font-size: 16px; }
  .body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .card {
    border: 1px solid var(--border);
    background: rgba(15,23,42,.4);
    border-radius: 12px;
    padding: 14px;
  }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .chev { color: #94a3b8; font-size: 16px; }
  .letter {
    width: 32px; height: 32px; border-radius: 999px; flex: none;
    background: rgba(19,127,236,.2); color: var(--primary);
    border: 1px solid rgba(19,127,236,.3);
    display: grid; place-items: center; font-weight: 800; font-size: 13px;
  }
  .who { min-width: 0; }
  .who b { display: block; font-size: 14px; font-weight: 700; }
  .who span { color: var(--faint); font-size: 12px; font-weight: 500; }
  .big { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .stats p { margin: 0; }
  .k { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; }
  .v { font-size: 14px; font-weight: 700; margin-top: 4px; }
  .muted { color: #cbd5e1; }
  .papers { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
  .paper { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0 7px 18px; }
  .paper b { font-size: 12px; font-weight: 600; }
  .paper .right { text-align: right; }
  .paper .right b { display: block; }
  .paper small { font-size: 10px; font-weight: 700; }
  .tabbar {
    position: sticky; bottom: 0; margin-top: 16px;
    display: flex; justify-content: space-between; align-items: flex-end;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 8px 12px;
  }
  .tab { flex: 1; min-width: 0; text-align: center; color: #94a3b8; font-size: 8px; font-weight: 500; background: none; border: 0; font-family: inherit; padding: 6px 0; line-height: 1; }
  .tab b { display: block; font-weight: 500; margin-top: 4px; white-space: nowrap; }
  .tab.on { color: var(--primary); }
  .tab .material-symbols-outlined { display: block; font-size: 22px; margin-bottom: 4px; }
  .gap { width: 56px; }
  .fab {
    position: absolute; left: 50%; top: -18px; transform: translateX(-50%);
    width: 56px; height: 56px; border-radius: 999px; border: 4px solid var(--surface);
    background: var(--primary); color: white;
    box-shadow: 0 4px 14px rgba(59,130,246,.5);
    display: grid; place-items: center;
  }
  .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24; }
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="brand"><span class="sq"><span class="material-symbols-outlined" style="font-size:18px">grid_view</span></span> FinTrack</div>
    <div class="tools">
      <span class="spark"><span class="material-symbols-outlined" style="font-size:18px">auto_awesome</span></span>
      <span class="round"><span class="material-symbols-outlined" style="font-size:18px">dark_mode</span></span>
      <span class="round"><span class="material-symbols-outlined" style="font-size:18px">flag</span></span>
      <span class="avatar"></span>
    </div>
  </div>
  <div class="page">
    <div>
      <h1>Minha Carteira</h1>
      <p class="sub">Visualização detalhada dos seus ativos em 01/Sep/26</p>
    </div>
    <div class="tools-row">
      <div class="date">01/Sep/26 <span class="material-symbols-outlined">calendar_month</span></div>
      <div class="total">
        <span class="ic"><span class="material-symbols-outlined">account_balance_wallet</span></span>
        <div><small>Total Atual</small><b id="grand"></b></div>
      </div>
    </div>
    <div class="switch">
      <button id="byType" class="on" type="button">Por tipo</button>
      <button id="byInst" type="button">Por instituição</button>
    </div>
    <div id="list" style="display:flex;flex-direction:column;gap:16px"></div>
  </div>
  <nav class="tabbar">
    <button class="tab" type="button"><span class="material-symbols-outlined">home</span><b>Dashboard</b></button>
    <button class="tab on" type="button"><span class="material-symbols-outlined">account_balance_wallet</span><b>Carteira</b></button>
    <span class="gap"></span>
    <button class="tab" type="button"><span class="material-symbols-outlined">swap_horiz</span><b>Movimentações</b></button>
    <button class="tab" type="button"><span class="material-symbols-outlined">settings</span><b>Configurações</b></button>
    <span class="fab"><span class="material-symbols-outlined">add</span></span>
  </nav>
</div>
<script>
const brl = (n) => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const k = (n) => {
  const abs = Math.abs(n);
  const body = abs >= 1000 ? (n / 1000).toFixed(1).replace(".", ",") + "k" : n.toFixed(1).replace(".", ",");
  return (n >= 0 ? "+" : "") + body;
};
const pct = (now, prev) => {
  if (!prev) return now ? "novo" : "—";
  const p = ((now - prev) / prev) * 100;
  return (p >= 0 ? "+" : "") + p.toFixed(1) + "%";
};
const tone = (n) => (n < 0 ? "down" : "up");
const ROWS = [
["Brasilprev","Previdência","PGBL Empresarial",12840.43,12667.5],
["Caixa","Renda Fixa","FGTS",85286.18,82362.76],
["Clear","Renda Fixa","Livre",0,3536.71],
["Clear","Renda Variável","Swing Trade",4220.04,0],
["Clear","Renda Variável","ABEV3",0,3281.35],
["Clear","Renda Variável","MBRF3",0,552.58],
["Clear","Renda Variável","CBAV3",0,352.17],
["Itaú","Renda Fixa","Cofrinhos",112438.94,111414.73],
["Mercado Pago","Renda Fixa","Cofrinhos",38455.55,37980],
["Nubank","Renda Fixa","Caixinhas",280045.79,246894.34],
["Nubank","Renda Fixa","Sara",81400,80551],
["Nubank","Renda Fixa","Livre",5222.1,554.28],
["Nubank","Renda Variável","CPTS11",26495.56,26038.74],
["Nubank","Renda Variável","TAEE4",23290.77,22084.08],
["Nubank","Renda Variável","HGCR11",13926.78,13984.11],
["Nubank","Renda Variável","SNCI11",9499.62,9244.26],
["Nubank","Renda Variável","HGRU11",6431.6,6475.84],
["Nubank","Renda Variável","SNFF11",5124.96,5148.72],
["Nubank","Renda Variável","BBAS3",3517.28,3206.46],
["Nubank","Renda Variável","BOVA11",3322.26,3186],
["Nubank","Renda Variável","B3SA3",2597,2325.4],
["Nubank","Renda Variável","LVBI11",2319.6,2350.8],
["Nubank","Renda Variável","WEGE3",1359.45,1341.9],
["Nubank","Renda Variável","VILG11",0,1119.24],
["Nubank","Renda Variável","USIM5",0,612],
["Nubank","Renda Variável","PETR4",0,561.84],
["Nubank","Renda Variável","VALE3",0,547.61],
["Nubank","Título Público","Tesouro IPCA+ com Juros Semestrais 2045",159589.11,154218.35],
["Nubank","Título Público","Tesouro IPCA+ com Juros Semestrais 2060",81021.25,77999.46],
["Nubank","Título Público","Tesouro Renda+ 2065",56107.27,50818.85],
["Nubank","Título Público","Tesouro IPCA+ 2040",48481.95,46804.28],
["Nubank","Título Público","Tesouro IPCA+ 2045",26823.82,25406.9],
["Nubank","Título Público","Tesouro Prefixado com Juros Semestrais 2035",8386.43,8191.3],
["Onze","Previdência","Previdência Icatu",45816.65,42289.24],
["XP","Renda Fixa","CDB BMG - DEZ/2027",42333.88,42135.26],
["XP","Renda Fixa","LCI Bari",9018.01,8991.35],
["XP","Renda Fixa","BTG Pactual Tesouro IPCA",8544.23,8380.8],
["XP","Renda Fixa","LCA BTG abr/2028",8239,8176.3],
["XP","Renda Fixa","CDB Pine mar/2027",5828.96,5774.17],
["XP","Renda Fixa","CDB Pine fev/2028",5197.85,5194.22],
["XP","Renda Fixa","LCA BTG jun/2028",4793.54,4758.04],
["XP","Renda Fixa","Deb Rota das Bandeiras",4338.06,4292.5],
["XP","Renda Fixa","CDB Banco Pan",3412.88,3387.42],
["XP","Renda Fixa","Trend Investback",603.09,596.63],
["XP","Renda Fixa","CDB Agibank set/2026",0,3543.01],
["XP","Renda Variável","Opportunity Market",17698.8,17515.57],
["XP","Renda Variável","XP Alocação Moderada",11085.75,10916.41],
["XP","Renda Variável","Equitas Selection",8251.75,7596.74],
["XP","Renda Variável","ACE Capital",6447.31,6344.5],
["XP","Renda Variável","Trend S&P 500",5975.99,6017.75],
["XP","Renda Variável","Hashdex Nasdaq",2459.36,2398.02],
["XP","Renda Variável","ARX Macro",2187.08,2133.01],
["XP","Renda Variável","XP Alocação Sofisticada",1261.61,1238.91],
["XP","Título Público","NTN-B1",30308.21,29595.24],
["XP","Título Público","NTN-B ago/2060",16533.36,15823.76],
["XP","Título Público","Tesouro IPCA+ 2035",11717.07,11289.64],
["XP","Título Público","Tesouro IPCA+ 2029",9198.75,8999.97],
["XP","Título Público","Tesouro IPCA+ juros 2040",5233.89,5054.79],
["XP","Título Público","Tesouro IPCA+ juros 2050",2225.57,0],
["XP","Título Público","Tesouro IPCA+ 2045",514.05,478.35]
];
const items = ROWS.map(([inst, cls, asset, now, prev]) => ({ inst, cls, asset, now, prev }));
let mode = "type";
const open = new Set();
function sum(list) { return list.reduce((a, r) => ({ now: a.now + r.now, prev: a.prev + r.prev }), { now: 0, prev: 0 }); }
function groups() {
  const ok = mode === "type" ? "cls" : "inst";
  const ik = mode === "type" ? "inst" : "cls";
  const map = {};
  items.forEach((r) => { (map[r[ok]] ||= []).push(r); });
  return Object.entries(map).map(([name, rows]) => {
    const inner = {};
    rows.forEach((r) => { (inner[r[ik]] ||= []).push(r); });
    const children = Object.entries(inner).map(([child, assets]) => ({
      name: child, ...sum(assets), assets: assets.slice().sort((a, b) => b.now - a.now)
    })).sort((a, b) => b.now - a.now);
    return { name, ...sum(rows), children };
  }).sort((a, b) => b.now - a.now);
}
function card(child, parentName, parentNow) {
  const id = parentName + "|" + child.name;
  const d = child.now - child.prev;
  const live = child.assets.filter((a) => a.now > 0);
  const subtitle = live.length === 1 ? live[0].asset : live.length + " ativos";
  const peso = parentNow ? (child.now / parentNow) * 100 : 0;
  const pesoTotal = grand ? (child.now / grand) * 100 : 0;
  const el = document.createElement("article");
  el.className = "card";
  el.innerHTML = `
    <div class="card-top">
      <div class="left">
        <span class="material-symbols-outlined chev">chevron_right</span>
        <div class="letter">${child.name.charAt(0)}</div>
        <div class="who"><b>${child.name}</b><span>${subtitle}</span></div>
      </div>
      <div class="big">${brl(child.now)}</div>
    </div>
    <div class="stats">
      <div><p class="k">Var. Abs</p><p class="v ${tone(d)}">${k(d)}</p></div>
      <div><p class="k">Var. Mês</p><p class="v ${tone(d)}">${pct(child.now, child.prev)}</p></div>
      <div><p class="k">Peso Categ.</p><p class="v muted">${peso.toFixed(1)}%</p></div>
      <div><p class="k">Peso Total</p><p class="v muted">${pesoTotal.toFixed(1)}%</p></div>
    </div>`;
  const papers = document.createElement("div");
  papers.className = "papers";
  papers.hidden = !open.has(id);
  child.assets.forEach((a) => {
    const dd = a.now - a.prev;
    const row = document.createElement("div");
    row.className = "paper";
    row.innerHTML = `<b>${a.now ? a.asset : a.asset + " · saiu"}</b><div class="right"><b>${a.now ? brl(a.now) : "—"}</b><small class="${tone(dd)}">${k(dd)} · ${pct(a.now, a.prev)}</small></div>`;
    papers.appendChild(row);
  });
  el.appendChild(papers);
  el.querySelector(".chev").style.transform = open.has(id) ? "rotate(90deg)" : "";
  el.addEventListener("click", () => {
    if (open.has(id)) open.delete(id); else open.add(id);
    render();
  });
  return el;
}
const grand = items.reduce((s, r) => s + r.now, 0);
document.getElementById("grand").textContent = brl(grand);
function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  groups().forEach((g) => {
    const d = g.now - g.prev;
    const icon = d >= 0 ? "trending_up" : "trending_down";
    const share = grand ? (g.now / grand) * 100 : 0;
    const sec = document.createElement("section");
    sec.className = "section";
    sec.innerHTML = `
      <div class="sec-head">
        <div class="sec-title"><span class="material-symbols-outlined">category</span>${g.name}</div>
        <div class="sec-meta">
          <span class="money">
            <b>${brl(g.now)}</b><span class="pipe">|</span>
            <span class="${tone(d)}">${k(d)}</span><span class="pipe">|</span>
            <span class="trend ${tone(d)}"><span class="material-symbols-outlined">${icon}</span>${pct(g.now, g.prev)}</span>
            <span class="vs">vs. último mês</span>
          </span>
          <span class="pill">${share.toFixed(1)}% da carteira</span>
        </div>
      </div>`;
    const body = document.createElement("div");
    body.className = "body";
    g.children.filter((c) => c.now > 0).forEach((c) => body.appendChild(card(c, g.name, g.now)));
    sec.appendChild(body);
    list.appendChild(sec);
  });
}
render();
document.getElementById("byType").onclick = () => { mode = "type"; open.clear(); document.getElementById("byType").classList.add("on"); document.getElementById("byInst").classList.remove("on"); render(); };
document.getElementById("byInst").onclick = () => { mode = "inst"; open.clear(); document.getElementById("byInst").classList.add("on"); document.getElementById("byType").classList.remove("on"); render(); };
</script>
</body>
</html>
